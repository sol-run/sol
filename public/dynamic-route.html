<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Content...</title>
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Extract query parameters
    const params = new URLSearchParams(window.location.search);
    const type = params.get('type');
    const id = params.get('id');
    
    // Fetch content based on route type and ID
    async function fetchContent() {
      try {
        // In a real app, this would fetch from an API
        // For demo purposes, we'll redirect to the homepage after a delay
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
      } catch (error) {
        console.error('Error fetching content:', error);
        document.getElementById('loading-text').textContent = 'Error loading content. Redirecting to homepage...';
      }
    }
    
    // Initialize page
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('content-type').textContent = type;
      document.getElementById('content-id').textContent = id;
      fetchContent();
    });
  </script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="text-center p-8 bg-white rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-4">Loading Content</h1>
    <p id="loading-text">
      Loading <span id="content-type">content</span> with ID: <span id="content-id"></span>
    </p>
    <div class="mt-4 w-full h-2 bg-gray-200 rounded-full overflow-hidden">
      <div class="bg-purple-600 h-full animate-pulse"></div>
    </div>
  </div>
</body>
</html>
